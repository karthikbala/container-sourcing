carrier_workflows:
- id: one-reference
  enabled: true
  match_carriers:
  - ONEY
  - ONE
  strip_prefixes:
  - ONEY
  allowed_hosts:
  - ecomm.one-line.com
  cache_seconds: 72000
  max_pages: 3
  request:
    method: POST
    url: https://ecomm.one-line.com/api/v2/edh/containers/track-and-trace/search
    headers:
      Origin: https://www.one-line.com
      Referer: https://www.one-line.com/
    json:
      page: '{{ page }}'
      page_length: 100
      filters:
        search_text: '{{ reference }}'
        search_type: BKG_NO
  rows: $.data[*]
  fields:
    container_number: $.containerNo
    booking: $.bookingNo
    pod: $.pod.code
    pol: $.por.code
    vessel: $.vesselVoyage.vesselName
    voyage: $.vesselVoyage.inboundConsortiumVoyage
  events:
    request:
      url: https://ecomm.one-line.com/api/v2/edh/containers/track-and-trace/cop-events
      query:
        booking_no: '{{ row.bookingNo }}'
        container_no: '{{ row.containerNo }}'
    rows: $.data[*]
    fields:
      eventCode: $.matrixId
      eventQualifier: $.triggerType
      eventTime: $.eventDate
      port: $.location.code
      terminal: $.yard.yardName
    qualifiers:
      ACTUAL: A
      ESTIMATED: E
    event_codes:
      E040: GTIN
      E058: LOAD
      E061: DEPA
      E089: ARRI
      E090: DISC
      E106: GTOT
      E138: EMPTY_RETURN
- id: msc-reference
  enabled: true
  match_carriers:
  - MEDU
  - MSCU
  - MSC
  allowed_hosts:
  - www.msc.com
  cache_seconds: 72000
  max_pages: 1
  max_references: 6
  managed_fallback: scrapedo
  verified_bot_403: true
  request:
    method: POST
    url: https://www.msc.com/api/feature/tools/TrackingInfo
    headers:
      Origin: https://www.msc.com
      Referer: https://www.msc.com/en/track-a-shipment
      User-Agent: Mozilla/5.0
    json:
      trackingNumber: '{{ reference }}'
      trackingMode: '0'
  success_path: $.IsSuccess
  success_value: true
  rows: $.Data.BillOfLadings[*].ContainersInfo[*]
  fields:
    container_number: $.ContainerNumber
    pod: $.Events[0].UnLocationCode
  events:
    inline: true
    rows: $.Events[*]
    date_format: '%d/%m/%Y'
    fields:
      eventCode: $.Description
      eventQualifier: $.Description
      eventTime: $.Date
      port: $.UnLocationCode
      terminal: $.EquipmentHandling.Name
    default_qualifier: A
    qualifiers:
      Estimated Time of Arrival: E
      Estimated Time of Departure: E
    event_codes:
      Estimated Time of Arrival: ARRI
      Estimated Time of Departure: DEPA
      Import Discharged from Vessel: DISC
      Full Import Discharged: DISC
      Full Import Positioned In: GTIN
      Full Import Positioned Out: GTOT
      Empty Returned: EMPTY_RETURN
      Export received at CY: GTIN
      Export Loaded on Vessel: LOAD
      Full Transshipment Loaded: LOAD
      Full Transshipment Discharged: DISC
  browser_fallback:
    mode: browser
    kind: bill_of_lading
    browser:
      headless: false
      native_user_agent: true
    steps:
    - goto: https://www.msc.com/en/track-a-shipment
    - wait_for:
        selector: '#onetrust-reject-all-handler'
        timeout: 15000
    - click: '#onetrust-reject-all-handler'
    - fill:
        selector: '#trackingNumber'
        value: '{{ reference }}'
    - capture_response:
        url: https://www.msc.com/api/feature/tools/TrackingInfo
        method: POST
        post_data_contains: '{{ reference }}'
        timeout: 20000
        trigger:
          click: .msc-search-autocomplete:has(#trackingNumber) .msc-search-autocomplete__search
  reference_kinds:
  - bill_of_lading
- id: evergreen-reference
  enabled: true
  match_carriers: [EGLV]
  strip_prefixes: [EGLV]
  allowed_hosts: [ct.shipmentlink.com]
  cache_seconds: 72000
  max_pages: 1
  max_references: 4
  reference_kinds: [bill_of_lading]
  prepare:
  - request:
      url: https://ct.shipmentlink.com/servlet/TDB1_CargoTracking.do
      headers: {User-Agent: Mozilla/5.0}
  request:
    method: POST
    url: https://ct.shipmentlink.com/servlet/TDB1_CargoTracking.do
    headers:
      User-Agent: Mozilla/5.0
      Referer: https://ct.shipmentlink.com/servlet/TDB1_CargoTracking.do
    form:
      BL: '{{ reference }}'
      CNTR: ''
      bkno: ''
      TYPE: BL
      SEL: s_bl
      'NO': '{{ reference }}'
  format: html
  success_xpath: //form[@name='frmCntrMove']/input[@name='bl_no']
  reference_path: //form[@name='frmCntrMove']/input[@name='bl_no']/@value
  rows: //tr[td/a[starts-with(@href,"javascript:frmCntrMoveDetail(")]]
  fields:
    container_number: ./td[1]/a/text()
    booking: string(//form[@name='frmCntrMove']/input[@name='bl_no']/@value)
    pod: string(//form[@name='frmCntrMove']/input[@name='pod']/@value)
    pol: string(//form[@name='frmCntrMove']/input[@name='pol']/@value)
    onboard: string(//form[@name='frmCntrMove']/input[@name='onboard_date']/@value)
    pod_country: string(//form[@name='frmCntrMove']/input[@name='podctry']/@value)
  events:
    request:
      method: POST
      url: https://ct.shipmentlink.com/servlet/TDB1_CargoTracking.do
      headers:
        Referer: https://ct.shipmentlink.com/servlet/TDB1_CargoTracking.do
      form:
        TYPE: CntrMove
        bl_no: '{{ fields.booking }}'
        cntr_no: '{{ fields.container_number }}'
        onboard_date: '{{ fields.onboard }}'
        pol: '{{ fields.pol }}'
        pod: '{{ fields.pod }}'
        podctry: '{{ fields.pod_country }}'
    format: html
    success_xpath: //table[tr/th[normalize-space(.)='Container Moves']]
    rows: //table[tr/th[normalize-space(.)='Container Moves']]/tr[td[1][not(@colspan)]]
    fields:
      eventCode: ./td[2]/text()
      eventQualifier: ./td[2]/text()
      eventTime: ./td[1]/text()
      port: ./td[3]/text()
    date_format: '%b-%d-%Y'
    qualifiers:
      Received (FCL): A
      Loaded (FCL) on vessel: A
      Discharged (FCL) from vessel: A
      Discharged (FCL): A
      Delivered (FCL): A
      Pick-up by merchant haulage: A
      Empty container returned: A
      Empty return: A
    event_codes:
      Received (FCL): GTIN
      Loaded (FCL) on vessel: LOAD
      Discharged (FCL) from vessel: DISC
      Discharged (FCL): DISC
      Delivered (FCL): GTOT
      Pick-up by merchant haulage: GTOT
      Empty container returned: EMPTY_RETURN
      Empty return: EMPTY_RETURN
    port_names:
      SHANGHAI (CN): CNSHG
      NINGBO, CHINA (CN): CNNBO
      NEW YORK, NY (US): USNYC
      LOS ANGELES, CA (US): USLAX
      LONG BEACH, CA (US): USLGB
      OAKLAND, CA (US): USOAK
      TACOMA, WA (US): USTIW
      SEATTLE, WA (US): USSEA
      SAVANNAH, GA (US): USSAV
      NORFOLK, VA (US): USORF
      HOUSTON, TX (US): USHOU
      BALTIMORE, MD (US): USBAL
      CHARLESTON, SC (US): USCHS
- id: cosco-reference
  enabled: true
  match_carriers: [COSU, COSCO]
  reference_echo_prefixes: [COSU]
  allowed_hosts: [elines.coscoshipping.com]
  cache_seconds: 72000
  max_pages: 1
  max_references: 8
  reference_kinds: [bill_of_lading]
  lookup_kinds: {bill_of_lading: blNumber, booking: bookingNumber}
  prepare:
  - request:
      method: POST
      url: https://elines.coscoshipping.com/scct/scct_customer_ex/public/cargoTracking/detail
      headers:
        Referer: https://elines.coscoshipping.com/scct/public/ct/base?lang=en
        Origin: https://elines.coscoshipping.com
      json:
        businessNumber: '{{ reference }}'
        businessNumberType: '{{ lookup_kind }}'
        notFilterResult: false
    # Public serialization mask shipped in COSCO's anonymous frontend, not an access credential.
    response_decode: &cosco_codec {type: base64_xor, mask: 'b3Ay6#9f1a@%&2^6'}
    success_path: $.success
    success_value: true
    not_found: {path: $.result.cargoTrackingSummary, value: null}
    reference_path: $.result.cargoTrackingSummary.blNumber
    captures:
      pod_city: $.result.cargoTrackingFullChain[?(@.locationType=='LPOD')].city
  request:
    method: POST
    url: https://elines.coscoshipping.com/scct/scct_customer_ex/public/cargoTracking/transportDetail
    headers:
      Referer: https://elines.coscoshipping.com/scct/public/ct/base?lang=en
      Origin: https://elines.coscoshipping.com
    json:
      businessNumber: '{{ reference }}'
      businessNumberType: '{{ lookup_kind }}'
      notFilterResult: false
      eventStage: OCEAN
  response_decode: *cosco_codec
  success_path: $.success
  success_value: true
  rows: $.result[*]
  fields:
    container_number: $.containerNumber
    pod: {template: '{{ pod_city }}'}
  transforms:
    pod:
      map:
        New York: USNYC
        Long Beach: USLGB
        Los Angeles: USLAX
        Oakland: USOAK
        Seattle: USSEA
        Tacoma: USTIW
        Savannah: USSAV
        Houston: USHOU
        Norfolk: USORF
        Baltimore: USBAL
        Charleston: USCHS
        Vancouver: CAVAN
        Prince Rupert: CAPRR
        Montreal: CAMTR
        Halifax: CAHAL
  events:
    inline: true
    rows: $
    fields:
      eventCode: $.latestEvent
      eventQualifier: $.latestEvent
      eventTime: $.latestEventTime
      port: {template: '{{ fields.pod }}'}
      terminal: $.latestEventLocation
    include_codes: [DISC]
    event_codes:
      Discharged at Last POD: DISC
    qualifiers:
      Discharged at Last POD: A
- id: zim-reference
  enabled: true
  match_carriers: [ZIMU, ZIM]
  allowed_hosts: [www.zim.com, apigw.zim.com]
  cache_seconds: 72000
  max_pages: 1
  max_references: 4
  reference_kinds: [bill_of_lading]
  verified_bot_403: true
  managed_fallback: scrapedo
  prepare:
  - request:
      url: https://www.zim.com/tools/track-a-shipment
    format: html
    captures:
      anonymous_key:
        path: //zim-navbar-v1/@apim-products
        json: "$['digital-website'].subscriptionKey"
  request:
    url: https://apigw.zim.com/digital/TrackShipment/v2/complete-result
    headers:
      Origin: https://www.zim.com
      Referer: https://www.zim.com/
    query:
      reference: '{{ reference }}'
      subscription-key: '{{ anonymous_key }}'
  success_path: $.isSuccess
  success_value: true
  groups: $.consgListItem[*]
  group_check:
    reference_path: $.referenceNo
  group_fields:
    booking: $.referenceNo
    pod: $.blRouteLeg.vpBrl[?(@.portToType=='POD')].portCodeTo
    terminal: $.blRouteLeg.vpBrl[?(@.portToType=='POD')].depotNameTo
    vessel_code: $.blRouteLeg.vpBrl[?(@.portToType=='POD')].vessel
    voyage: $.blRouteLeg.vpBrl[?(@.portToType=='POD')].voyage
  rows: $.consDetails.consContainers.consContainersItem[*]
  fields:
    container_number: {template: '{{ row.unitPrefix }}{{ row.unitNo | trim }}'}
    booking: {template: '{{ group.booking }}'}
    pod: {template: '{{ group.pod }}'}
  transforms:
    pod:
      # The carrier's marine POD route uses its Houston city code.
      map: {USIAH: USHOU}
  events:
    inline: true
    rows: $.unitActivities.unitActivitiesItem[*]
    fields:
      eventCode: $.activityCode
      eventQualifier: $.activityCode
      eventTime: $.activityDateTz
      port: $.placeFrom
      terminal:
        # Attribute only a matching marine leg. An empty return can be at a different depot.
        template: "{{ group.terminal if row.activityCode in ['DISF','OICF','CNT_VESSEL_ARRIVAL'] and row.placeFrom == group.pod and row.vessel == group.vessel_code and row.voyage == group.voyage else '' }}"
    include_codes: [GTIN, LOAD, DISC, GTOT, EMPTY_RETURN, ARRI, DEPA]
    qualifiers:
      IEXF: A
      LODF: A
      DISF: A
      OICF: A
      INME: A
      CNT_VESSEL_ARRIVAL: A
      CNT_VESSEL_DEPARTURE: A
    event_codes:
      IEXF: GTIN
      LODF: LOAD
      DISF: DISC
      OICF: GTOT
      INME: EMPTY_RETURN
      CNT_VESSEL_ARRIVAL: ARRI
      CNT_VESSEL_DEPARTURE: DEPA
    port_names: {USIAH: USHOU}
