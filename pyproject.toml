[project]
name = "container-sourcing"
version = "0.1.0"
description = "Deterministic container evidence discovery, ranking and manual, insert-only enrollment."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "jsonpath-ng>=1.6",
    "lxml>=5.3",
    "python-dateutil>=2.9",
    "mcp>=1.28,<2",
    "pypdf>=5,<7",
]

[project.scripts]
container-sourcing = "container_sourcing.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/container_sourcing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
